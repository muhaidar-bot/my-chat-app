<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d33"/>
      <stop offset="50%" stop-color="#180720"/>
      <stop offset="100%" stop-color="#0e0413"/>
    </linearGradient>
    <linearGradient id="crescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="50%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Romantic Moon Crescent -->
  <path d="M 330 110 C 220 110 130 200 130 310 C 130 385 170 448 230 480 C 205 450 190 410 190 365 C 190 270 265 195 360 195 C 388 195 414 202 436 215 C 410 152 374 110 330 110 Z" fill="url(#crescent)" filter="url(#glow)"/>
  <!-- Glowing Heart inside -->
  <path d="M 350 250 C 330 220 280 230 280 270 C 280 320 350 360 350 360 C 350 360 420 320 420 270 C 420 230 370 220 350 250 Z" fill="#ff2e79" filter="url(#glow)"/>
  <!-- Little Sparkles -->
  <circle cx="150" cy="180" r="5" fill="#ffd166"/>
  <circle cx="390" cy="140" r="4" fill="#ff7eb3"/>
  <circle cx="210" cy="130" r="3" fill="#ffffff"/>
  <circle cx="380" cy="400" r="4" fill="#ffd166"/>
</svg>
